# Validate and publish a release, then create its tag and GitHub release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo version to release, without a leading v
        required: true
        type: string
      dry-run:
        description: Run validation without publishing
        required: true
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  validate-release:
    name: Validate release
    if: github.repository == 'astral-sh/astral-ini' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release metadata
        shell: bash
        run: |
          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "astral-ini") | .version'
          )"
          if [[ "$package_version" != "$VERSION" ]]; then
            echo "::error::Requested version ${VERSION} does not match Cargo.toml version ${package_version}"
            exit 1
          fi

          tag="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            test "$(git rev-parse "refs/tags/${tag}^{commit}")" = "$GITHUB_SHA"
          fi

          echo "Preparing ${tag} from ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ inputs.version }}

      - name: Verify release package
        run: cargo publish -p astral-ini --dry-run --locked

      - name: Verify release notes
        run: |
          awk -v version="$VERSION" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.txt"
          test -s "$RUNNER_TEMP/notes.txt"
        env:
          VERSION: ${{ inputs.version }}

  release-gate:
    # N.B. This name should not change; the release environment gate relies on it.
    name: release-gate
    needs: validate-release
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    environment:
      name: release-gate
    permissions: {}
    steps:
      - run: echo "Release approved"

  publish-crates:
    name: Publish to crates.io
    needs: release-gate
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check for an existing crates.io release
        id: published
        shell: bash
        run: |
          status="$(
            curl \
              --retry 3 \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --user-agent 'astral-ini-crates-io-publish (github.com/astral-sh/astral-ini)' \
              "https://crates.io/api/v1/crates/astral-ini/${VERSION}"
          )"
          case "$status" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "astral-ini ${VERSION} is already published; skipping upload." >> "$GITHUB_STEP_SUMMARY"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io returned HTTP ${status} while checking astral-ini ${VERSION}"
              exit 1
              ;;
          esac
        env:
          VERSION: ${{ inputs.version }}

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.published.outputs.published != 'true'
        id: auth

      - name: Publish to crates.io
        if: steps.published.outputs.published != 'true'
        run: cargo publish -p astral-ini --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-github:
    name: Create GitHub release
    needs: publish-crates
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Get release token
        id: release-token
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.RELEASES_STS_API_URL }}/exchange
          audience: ${{ secrets.RELEASES_STS_API_URL }}
          repository: astral-sh/astral-ini
          # Tag the selected commit even if main advances across workflow changes.
          permissions: |
            contents: write
            workflows: write

      - name: Create GitHub release and tag
        shell: bash
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            exit 0
          fi
          awk -v version="$VERSION" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.txt"
          test -s "$RUNNER_TEMP/notes.txt"
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "astral-ini v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.txt" \
            "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
